name: chess_for_kids
description: Offline chess tutor for children aged 5 and up.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.2
  flutter_tts: ^4.2.5
  intl: ^0.20.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/pieces/basic/
    - assets/avatars/animals/
    - assets/avatars/robots/
    - assets/avatars/ufo/
    - assets/avatars/vehicles/
