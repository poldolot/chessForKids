name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  # Analysis and tests run beside the APK build, not before it, so the
  # whole run takes as long as the slower of the two.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --reporter expanded --timeout 120s

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build APK (debug-signed until a release keystore is configured)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: chess-for-kids-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # A tag gets its release only when both the tests and the build passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chess-for-kids-apk

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v3
        with:
          files: app-release.apk
          generate_release_notes: true
